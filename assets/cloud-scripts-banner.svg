<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Backdrop -->
  <rect width="1280" height="400" fill="url(#bg)" />

  <!-- Tech Matrix Blueprint Grid -->
  <g opacity="0.12" stroke="#0284C7" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1280" height="400" fill="url(#grid)" />
  </g>

  <!-- High-Tech Data Stream Vectors -->
  <g opacity="0.25">
    <path d="M -50 100 Q 300 60 640 180 T 1330 220" fill="none" stroke="#0284C7" stroke-width="2" />
    <path d="M -50 280 Q 400 340 780 240 T 1330 140" fill="none" stroke="#10B981" stroke-width="2" />
  </g>

  <!-- Left: Hero Graphic Emblematics -->
  <g transform="translate(180, 200)">
    <!-- Concentric Orbit Rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#0284C7" stroke-width="2" stroke-dasharray="30 15 60 15" opacity="0.7" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="#10B981" stroke-width="2" opacity="0.6" />
    
    <!-- Outer Spoke Nodes -->
    <circle cx="0" cy="-140" r="10" fill="#0B0F19" stroke="#0284C7" stroke-width="3" />
    <circle cx="140" cy="0" r="10" fill="#0B0F19" stroke="#10B981" stroke-width="3" />
    <circle cx="0" cy="140" r="10" fill="#0B0F19" stroke="#F59E0B" stroke-width="3" />
    <circle cx="-140" cy="0" r="10" fill="#0B0F19" stroke="#0284C7" stroke-width="3" />

    <!-- Central Iconography Transformed -->
    <g transform="translate(-256, -256)">

    <!-- Cloud Cluster Motif -->
    <path d="M 200 280 H 320 C 350 280 370 260 370 230 C 370 205 350 185 325 185 C 320 155 295 135 265 135 C 235 135 210 155 205 185 C 180 190 160 210 160 235 C 160 260 180 280 200 280 Z"
          fill="none" stroke="#0284C7" stroke-width="5" />
    <!-- Infrastructure Nodes -->
    <rect x="200" y="220" width="30" height="20" rx="3" fill="#10B981" />
    <rect x="245" y="220" width="30" height="20" rx="3" fill="#F59E0B" />
    <rect x="290" y="220" width="30" height="20" rx="3" fill="#0284C7" />
    <line x1="256" y1="280" x2="256" y2="330" stroke="#10B981" stroke-width="4" stroke-dasharray="6 4" />
    <circle cx="256" cy="336" r="8" fill="#F59E0B" />
        
    </g>
  </g>

  <!-- Right: Typography & Capability Badges -->
  <g transform="translate(420, 100)">
    <!-- Overline Category Capsule -->
    <rect x="0" y="0" width="310" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="13" r="5" fill="#0284C7" filter="url(#glow)" />
    <text x="28" y="17" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">KOALITY-ASSURED • MULTI-CLOUD AUTOMATION</text>

    <!-- Project Title -->
    <text x="0" y="72" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" letter-spacing="1">CLOUD SCRIPTS</text>

    <!-- Subtitle -->
    <text x="0" y="110" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">Multi-Cloud Security, FinOps, Inventory &amp; Automation Tooling across AWS, GCP, Azure &amp; Prisma Cloud</text>

    <!-- Capability Chips -->
    <g transform="translate(0, 150)">
      <!-- Chip 1: Multi-Cloud FinOps -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="210" height="38" rx="8" fill="#111827" stroke="#0284C7" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#0284C7" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Multi-Cloud FinOps</text>
      </g>
      <!-- Chip 2: AWS / GCP / Azure -->
      <g transform="translate(224, 0)">
        <rect x="0" y="0" width="201" height="38" rx="8" fill="#111827" stroke="#10B981" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#10B981" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">AWS / GCP / Azure</text>
      </g>
      <!-- Chip 3: Prisma Cloud RQL -->
      <g transform="translate(439, 0)">
        <rect x="0" y="0" width="192" height="38" rx="8" fill="#111827" stroke="#F59E0B" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#F59E0B" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Prisma Cloud RQL</text>
      </g>
      <!-- Chip 4: Least-Privilege IAM -->
      <g transform="translate(645, 0)">
        <rect x="0" y="0" width="219" height="38" rx="8" fill="#111827" stroke="#38BDF8" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#38BDF8" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Least-Privilege IAM</text>
      </g>
    </g>
  </g>
</svg>
