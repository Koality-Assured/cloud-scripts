<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="4" />

  <!-- Background Geometric Orbit Tracks -->
  <g opacity="0.2" stroke="#475569" stroke-width="1.5">
    <circle cx="256" cy="256" r="210" fill="none" stroke-dasharray="6 8" />
    <circle cx="256" cy="256" r="160" fill="none" />
    <circle cx="256" cy="256" r="110" fill="none" stroke-dasharray="4 6" />
    <line x1="256" y1="46" x2="256" y2="466" />
    <line x1="46" y1="256" x2="466" y2="256" />
  </g>

  <!-- Outer Orbit Nodes -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#accent-cyan)" stroke-width="3" opacity="0.5" stroke-dasharray="40 20 80 20" />
  <g fill="#0B0F19" stroke-width="3">
    <circle cx="256" cy="71" r="14" stroke="#0284C7" />
    <circle cx="256" cy="71" r="5" fill="#0284C7" />
    <circle cx="441" cy="256" r="14" stroke="#10B981" />
    <circle cx="441" cy="256" r="5" fill="#10B981" />
    <circle cx="256" cy="441" r="14" stroke="#F59E0B" />
    <circle cx="256" cy="441" r="5" fill="#F59E0B" />
    <circle cx="71" cy="256" r="14" stroke="#0284C7" />
    <circle cx="71" cy="256" r="5" fill="#0284C7" />
  </g>

  <!-- Central Emblem Geometry -->
  <g filter="url(#glow)">

    <!-- Cloud Cluster Motif -->
    <path d="M 200 280 H 320 C 350 280 370 260 370 230 C 370 205 350 185 325 185 C 320 155 295 135 265 135 C 235 135 210 155 205 185 C 180 190 160 210 160 235 C 160 260 180 280 200 280 Z"
          fill="none" stroke="#0284C7" stroke-width="5" />
    <!-- Infrastructure Nodes -->
    <rect x="200" y="220" width="30" height="20" rx="3" fill="#10B981" />
    <rect x="245" y="220" width="30" height="20" rx="3" fill="#F59E0B" />
    <rect x="290" y="220" width="30" height="20" rx="3" fill="#0284C7" />
    <line x1="256" y1="280" x2="256" y2="330" stroke="#10B981" stroke-width="4" stroke-dasharray="6 4" />
    <circle cx="256" cy="336" r="8" fill="#F59E0B" />
        
  </g>

  <!-- Bus Trajectory Pulses -->
  <circle cx="176" cy="134" r="4" fill="#0284C7" filter="url(#glow)" />
  <circle cx="336" cy="134" r="4" fill="#10B981" filter="url(#glow)" />
  <circle cx="336" cy="378" r="4" fill="#F59E0B" filter="url(#glow)" />
  <circle cx="176" cy="378" r="4" fill="#0284C7" filter="url(#glow)" />
</svg>
